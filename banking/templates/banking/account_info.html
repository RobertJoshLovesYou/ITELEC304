<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Info</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .status-box {
            background-color: #e3f2fd;
            color: #1565c0;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #bbdefb;
            font-size: 18px;
            line-height: 1.5;
        }
        .error-msg {
            color: #c0392b;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Banking Account Information</h1>
        {% if account %}
            <div class="status-box">
                <strong>Status:</strong><br>{{ account.display_info }}
            </div>
        {% else %}
            <p class="error-msg">No account found. Please use the Django admin or shell to create one!</p>
        {% endif %}
    </div>
</body>
</html>
